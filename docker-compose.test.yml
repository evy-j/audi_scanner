name: audit-scanner-test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_scanner_test
      POSTGRES_USER: audit_scanner
      POSTGRES_PASSWORD: audit_scanner
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_scanner -d audit_scanner_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - test

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - test

  docker:
    image: docker:27-dind
    profiles:
      - scanner
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - test_docker_data:/var/lib/docker
      - .:/workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - test

networks:
  test:
    driver: bridge

volumes:
  test_postgres_data:
  test_docker_data:
