name: Supabase Heartbeat

on:
  schedule:
    # Runs daily at 03:23 UTC. GitHub scheduled workflows use UTC.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Run tiny SQL heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_HEARTBEAT_DATABASE_URL: ${{ secrets.SUPABASE_HEARTBEAT_DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run database heartbeat SQL
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="${SUPABASE_HEARTBEAT_DATABASE_URL:-${PRODUCTION_DATABASE_URL:-}}"
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing secret: set SUPABASE_HEARTBEAT_DATABASE_URL or PRODUCTION_DATABASE_URL in GitHub repository secrets." >&2
            exit 1
          fi
          export DATABASE_URL
          printf 'SELECT 1 AS audit_scanner_supabase_heartbeat;\n' | npx prisma db execute --schema packages/database/prisma/schema.prisma --stdin
          echo "Supabase heartbeat SQL completed."
