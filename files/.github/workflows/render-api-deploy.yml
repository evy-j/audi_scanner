name: Render API Deploy Hook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-api-deploy-main
  cancel-in-progress: true

jobs:
  trigger-render:
    name: Trigger Render API deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deploy hook
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_DEPLOY_HOOK_URL:-}" ]; then
            echo "Missing GitHub secret: RENDER_API_DEPLOY_HOOK_URL" >&2
            echo "Add Render service Deploy Hook URL in GitHub → Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          curl -fsS -X POST "${RENDER_API_DEPLOY_HOOK_URL}"
          echo "Render API deploy triggered."
