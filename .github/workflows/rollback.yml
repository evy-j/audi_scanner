name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to roll back
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - api
          - worker
      frontend_deployment_url:
        description: Previous Vercel deployment URL for frontend rollback
        required: false
        type: string
      reason:
        description: Rollback reason
        required: true
        type: string

concurrency:
  group: rollback-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  rollback-frontend:
    name: Roll Back Vercel Frontend
    runs-on: ubuntu-latest
    if: (inputs.target == 'all' || inputs.target == 'frontend') && inputs.frontend_deployment_url != ''
    environment: production
    steps:
      - name: Roll back Vercel alias
        run: npx vercel rollback "${FRONTEND_DEPLOYMENT_URL}" --yes --token "${VERCEL_TOKEN}"
        env:
          FRONTEND_DEPLOYMENT_URL: ${{ inputs.frontend_deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  rollback-api:
    name: Roll Back Render API
    runs-on: ubuntu-latest
    if: inputs.target == 'all' || inputs.target == 'api'
    environment: production
    steps:
      - name: Trigger API rollback hook
        run: curl -fsS -X POST "${RENDER_API_ROLLBACK_HOOK_URL}"
        env:
          RENDER_API_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_API_ROLLBACK_HOOK_URL }}

  rollback-worker:
    name: Roll Back Render Workers
    runs-on: ubuntu-latest
    if: inputs.target == 'all' || inputs.target == 'worker'
    environment: production
    steps:
      - name: Trigger worker rollback hook
        run: curl -fsS -X POST "${RENDER_WORKER_ROLLBACK_HOOK_URL}"
        env:
          RENDER_WORKER_ROLLBACK_HOOK_URL: ${{ secrets.RENDER_WORKER_ROLLBACK_HOOK_URL }}

  record:
    name: Record Rollback
    runs-on: ubuntu-latest
    needs:
      - rollback-frontend
      - rollback-api
      - rollback-worker
    if: always()
    steps:
      - run: |
          echo "### Rollback requested" >> "${GITHUB_STEP_SUMMARY}"
          echo "Target: ${{ inputs.target }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Reason: ${{ inputs.reason }}" >> "${GITHUB_STEP_SUMMARY}"

