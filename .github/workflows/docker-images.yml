name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: false
        type: string

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  SCANNER_IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  application-images:
    name: API and Worker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: image
        run: echo "namespace=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/api:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/worker:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  scanner-images:
    name: Scanner Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: image
        run: echo "namespace=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build scanner image set
        run: docker compose -f docker-compose.scanners.yml --profile scanner-images build scanner-base scanner-slither scanner-mythril scanner-semgrep scanner-foundry

      - name: Tag scanner images for GHCR
        run: |
          docker tag audit-scanner/scanner-base:${SCANNER_IMAGE_TAG} ${IMAGE_NAMESPACE}/scanner-base:${SCANNER_IMAGE_TAG}
          docker tag audit-scanner/scanner-slither:${SCANNER_IMAGE_TAG} ${IMAGE_NAMESPACE}/scanner-slither:${SCANNER_IMAGE_TAG}
          docker tag audit-scanner/scanner-mythril:${SCANNER_IMAGE_TAG} ${IMAGE_NAMESPACE}/scanner-mythril:${SCANNER_IMAGE_TAG}
          docker tag audit-scanner/scanner-semgrep:${SCANNER_IMAGE_TAG} ${IMAGE_NAMESPACE}/scanner-semgrep:${SCANNER_IMAGE_TAG}
          docker tag audit-scanner/scanner-foundry:${SCANNER_IMAGE_TAG} ${IMAGE_NAMESPACE}/scanner-foundry:${SCANNER_IMAGE_TAG}
        env:
          IMAGE_NAMESPACE: ${{ steps.image.outputs.namespace }}

      - name: Smoke scanner images
        run: docker compose -f docker-compose.scanners.yml --profile scanner-smoke run --rm scanner-slither && docker compose -f docker-compose.scanners.yml --profile scanner-smoke run --rm scanner-mythril && docker compose -f docker-compose.scanners.yml --profile scanner-smoke run --rm scanner-semgrep && docker compose -f docker-compose.scanners.yml --profile scanner-smoke run --rm scanner-foundry

      - name: Push scanner images
        run: |
          docker push ${IMAGE_NAMESPACE}/scanner-base:${SCANNER_IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/scanner-slither:${SCANNER_IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/scanner-mythril:${SCANNER_IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/scanner-semgrep:${SCANNER_IMAGE_TAG}
          docker push ${IMAGE_NAMESPACE}/scanner-foundry:${SCANNER_IMAGE_TAG}
        env:
          IMAGE_NAMESPACE: ${{ steps.image.outputs.namespace }}
