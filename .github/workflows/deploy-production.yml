name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Images
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        type: string
      run_migrations:
        description: Run Prisma migrations before deploy
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  guard:
    name: Deployment Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "Production deployment guard passed for ${IMAGE_TAG}"

  migrate:
    name: Prisma Migrate Production
    runs-on: ubuntu-latest
    needs: guard
    environment: production
    if: github.event_name == 'workflow_run' || inputs.run_migrations
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate status --schema packages/database/prisma/schema.prisma
      - run: npm run db:deploy

  deploy-backend:
    name: Deploy Render API and Workers
    runs-on: ubuntu-latest
    needs:
      - guard
      - migrate
    if: always() && needs.guard.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment: production
    steps:
      - name: Trigger Render API deploy
        run: curl -fsS -X POST "${RENDER_API_DEPLOY_HOOK_URL}"
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

      - name: Trigger Render worker deploy
        run: curl -fsS -X POST "${RENDER_WORKER_DEPLOY_HOOK_URL}"
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}

  deploy-frontend:
    name: Deploy Vercel Frontend
    runs-on: ubuntu-latest
    needs: guard
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx vercel pull --yes --environment=production --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel build --prod --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token "${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
      - deploy-frontend
    environment: production
    steps:
      - name: API health
        run: curl -fsS "${PRODUCTION_API_BASE_URL}/health"
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
