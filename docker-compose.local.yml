name: audit-scanner-local

x-node-build: &node-build
  context: .
  dockerfile: docker/local/node.Dockerfile

x-node-volumes: &node-volumes
  - .:/workspace
  - node_modules:/workspace/node_modules
  - web_next:/workspace/apps/web/.next

x-common-env: &common-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgresql://audit_scanner:audit_scanner@postgres:5432/audit_scanner?schema=public
  DIRECT_DATABASE_URL: postgresql://audit_scanner:audit_scanner@postgres:5432/audit_scanner?schema=public
  REDIS_URL: redis://redis:6379
  REDIS_KEY_PREFIX: "audit-scanner:local"
  REDIS_ENABLE_TLS: "false"
  REDIS_COMMAND_TIMEOUT_MS: "10000"

x-node-hardening: &node-hardening
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_scanner
      POSTGRES_USER: audit_scanner
      POSTGRES_PASSWORD: audit_scanner
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_scanner -d audit_scanner"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app
    mem_limit: 1g
    cpus: 1

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app
    mem_limit: 512m
    cpus: 0.5

  docker:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - docker_data:/var/lib/docker
      - .:/workspace
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - scanner-daemon
    mem_limit: 6g
    cpus: 4

  migrate:
    build: *node-build
    working_dir: /workspace
    command: ["sh", "-lc", "npm run db:generate && npm run db:deploy && npm run db:seed:dev"]
    environment:
      <<: *common-env
      DEV_SEED_EMAIL: ${DEV_SEED_EMAIL:-dev@audit-scanner.local}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
      DEV_SEED_PASSWORD_HASH: ${DEV_SEED_PASSWORD_HASH:-}
      DEV_SEED_ORG_SLUG: ${DEV_SEED_ORG_SLUG:-development-labs}
    volumes: *node-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    <<: *node-hardening
    restart: "no"
    mem_limit: 1g
    cpus: 1

  api:
    build: *node-build
    working_dir: /workspace
    command: ["npm", "--workspace", "@audit-scanner/api", "run", "dev"]
    environment:
      <<: *common-env
      PORT: "4000"
      API_BASE_PATH: /api/v1
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      REALTIME_WS_PATH: /api/v1/realtime
      REALTIME_HEARTBEAT_INTERVAL_MS: "25000"
      REALTIME_MAX_SUBSCRIPTIONS_PER_CONNECTION: "50"
      REALTIME_REPLAY_MAX_EVENTS: "250"
      REALTIME_MAX_MESSAGE_BYTES: "65536"
      REALTIME_MAX_BUFFERED_BYTES: "1048576"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-access-secret-change-me-32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-refresh-secret-change-me-32}
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "2592000"
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-development-api-key-secret-change-me-32}
      PASSWORD_MIN_LENGTH: "12"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX_REQUESTS: "300"
      AUTH_RATE_LIMIT_MAX_REQUESTS: "20"
      SCAN_RATE_LIMIT_MAX_REQUESTS: "30"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes: *node-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app
    <<: *node-hardening
    mem_limit: 1g
    cpus: 1

  worker:
    build: *node-build
    working_dir: /workspace
    command: ["npm", "--workspace", "@audit-scanner/worker", "run", "dev"]
    environment:
      <<: *common-env
      WORKER_HOSTNAME: local-worker
      DOCKER_HOST: tcp://docker:2375
      SCANNER_EXECUTION_MODE: container
      SCANNER_DOCKER_BINARY: docker
      SCANNER_ARTIFACT_ROOT: /workspace/.artifacts
      SCANNER_TEMP_ROOT: /workspace/.scanner-tmp
      SCANNER_CLEANUP_TEMP_WORKSPACE: "true"
      SCANNER_TEMP_RETENTION_MS: "86400000"
      SCANNER_WORKSPACE_MOUNT_PATH: /workspace
      SCANNER_OUTPUT_MOUNT_PATH: /output
      SCANNER_NETWORK_MODE: none
      SCANNER_IPC_MODE: none
      SCANNER_READ_ONLY_ROOT_FILESYSTEM: "true"
      SCANNER_NO_NEW_PRIVILEGES: "true"
      SCANNER_DOCKER_PULL_POLICY: never
      SCANNER_CONTAINER_USER: "10001:10001"
      SCANNER_SECCOMP_PROFILE: /workspace/docker/security/seccomp-scanner.json
      SCANNER_DISABLE_SWAP: "true"
      SCANNER_TMPFS_NOEXEC: "true"
      SCANNER_ULIMIT_NOFILE: "1024"
      SCANNER_OUTPUT_DIRECTORY_MODE: "0777"
      SCANNER_DOCKER_LABEL_PREFIX: audit-scanner-local
      SCANNER_PIDS_LIMIT: "256"
      SCANNER_TMPFS_SIZE_MB: "256"
      SCANNER_MAX_STDOUT_BYTES: "20971520"
      SCANNER_MAX_STDERR_BYTES: "20971520"
      SCANNER_MAX_OUTPUT_ARTIFACTS: "64"
      SCANNER_MAX_OUTPUT_ARTIFACT_BYTES: "104857600"
      SCANNER_STOP_GRACE_SECONDS: "5"
      SCANNER_DEFAULT_CPU_LIMIT: "1"
      SCANNER_DEFAULT_MEMORY_MB: "2048"
      SLITHER_CPU_LIMIT: "2"
      SLITHER_MEMORY_MB: "4096"
      MYTHRIL_CPU_LIMIT: "2"
      MYTHRIL_MEMORY_MB: "8192"
      SEMGREP_CPU_LIMIT: "2"
      SEMGREP_MEMORY_MB: "4096"
      SEMGREP_RULESET: auto
      SEMGREP_JOBS: "2"
      MYTHRIL_MAX_DEPTH: "64"
      MYTHRIL_TRANSACTION_COUNT: "3"
      MYTHRIL_SOLVER_TIMEOUT_MS: "10000"
      AI_REPORT_PROVIDER: disabled
      REPORT_PDF_RENDERER: basic
      CONCURRENCY_SCAN_ORCHESTRATOR: "4"
      CONCURRENCY_SOURCE_PREPARE: "2"
      CONCURRENCY_SLITHER: "1"
      CONCURRENCY_MYTHRIL: "1"
      CONCURRENCY_SEMGREP: "1"
      CONCURRENCY_FOUNDRY: "1"
      CONCURRENCY_FINDINGS_NORMALIZE: "2"
      CONCURRENCY_RISK_SCORE: "2"
      CONCURRENCY_AI_REPORT: "1"
      CONCURRENCY_PDF_GENERATE: "1"
      CONCURRENCY_NOTIFICATIONS: "4"
    volumes: *node-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - app
      - scanner-daemon
    <<: *node-hardening
    mem_limit: 2g
    cpus: 2

  web:
    build: *node-build
    working_dir: /workspace
    command: ["npm", "--workspace", "@audit-scanner/web", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}/api/v1
      NEXT_PUBLIC_REALTIME_WS_URL: ws://localhost:${API_PORT:-4000}/api/v1/realtime
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes: *node-volumes
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app
    <<: *node-hardening
    mem_limit: 2g
    cpus: 1.5

networks:
  app:
    driver: bridge
  scanner-daemon:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  docker_data:
  node_modules:
  web_next:
